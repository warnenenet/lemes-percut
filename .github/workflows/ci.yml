name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust Clippy, Unit & MySQL 8 E2E Tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: lms_ci_root_password
          MYSQL_DATABASE: lms_smkn1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plms_ci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain (1.85.0)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.7.5
        with:
          workspaces: rust

      - name: Ensure deterministic Cargo.lock from exact pins
        run: |
          if ! grep -q 'source = ' Cargo.lock; then
            echo "Placeholder Cargo.lock detected; generating lockfile from exact workspace pins..."
            cargo generate-lockfile
          fi

      - name: Check Rust formatting (advisory)
        run: cargo fmt --all -- --check || echo "::warning::Run cargo fmt locally to normalize formatting."

      - name: Run Clippy with strict warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust unit & MySQL 8 E2E integration tests
        env:
          DATABASE_URL: mysql://root:lms_ci_root_password@127.0.0.1:3306/lms_smkn1
          REQUIRE_MYSQL_E2E: "1"
        run: cargo test --workspace --locked -- --nocapture

  frontend-check:
    name: Frontend Typecheck & Vite SPA Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d3673f48c894c558efc9d1 # v4.2.0
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Vite production SPA build
        run: npm run build

      - name: Verify server.ts is excluded from production dist
        run: test -f dist/index.html && test ! -f dist/server.js

  docker-smoke-build:
    name: Docker Smoke Build (No Push)
    needs: [rust-check, frontend-check]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebc0fb26ef8d2335fa5033fad01 # v3.9.0

      - name: Build Docker image locally
        uses: docker/build-push-action@48dad32662fa2b6e1e6bc9da066601445d4715f # v6.10.0
        with:
          context: .
          file: docker/rust-server/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: lms-smkn1-rust:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify compiled binaries and assets in image
        run: |
          docker run --rm --entrypoint /bin/sh lms-smkn1-rust:ci-smoke -c \
            'test -x /app/lms-server && test -x /app/seed && test -x /app/entrypoint.sh && test -f /app/dist/index.html'
