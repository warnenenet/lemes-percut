[workspace]
members = [
    "crates/lms-domain",
    "crates/lms-server",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["SMK Negeri 1 Percut Sei Tuan Engineering"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
thiserror = "=2.0.12"
anyhow = "=1.0.97"
chrono = { version = "=0.4.40", features = ["serde"] }
rust_decimal = { version = "=1.37.1", features = ["serde"] }
tokio = { version = "=1.44.1", features = ["full"] }
axum = { version = "=0.8.1", features = ["macros"] }
tower = { version = "=0.5.2", features = ["util"] }
tower-http = { version = "=0.6.2", features = ["fs", "cors", "trace"] }
http-body-util = "=0.1.2"
sqlx = { version = "=0.8.3", features = ["runtime-tokio", "tls-rustls-ring", "mysql", "chrono", "json", "rust_decimal"] }
base64 = "=0.22.1"
uuid = { version = "=1.16.0", features = ["v4"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
