# Reverse Proxy Nginx Production untuk lms.sekolah.sch.id, cbt.sekolah.sch.id, dan fallback LAN lokal
upstream lms_upstream {
    server app:3000;
    keepalive 32;
}

upstream cbt_upstream {
    server cbt_app:3001;
    keepalive 32;
}

# HTTP: Redirect domain publik ke HTTPS, tetap layani healthcheck internal
server {
    listen 80;
    server_name lms.sekolah.sch.id;

    location /api/health {
        proxy_pass http://lms_upstream;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name cbt.sekolah.sch.id;

    location /api/health {
        proxy_pass http://cbt_upstream;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Fallback Intranet Lokal (HTTP port 80 untuk IP LAN sekolah saat koneksi internet putus)
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 25M;

    location / {
        proxy_pass http://lms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS — LMS Utama (lms.sekolah.sch.id)
server {
    listen 443 ssl http2;
    server_name lms.sekolah.sch.id;

    ssl_certificate /etc/letsencrypt/live/lms.sekolah.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.sekolah.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://lms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# HTTPS — Subdomain CBT Terpisah (cbt.sekolah.sch.id -> container cbt_app port 3001)
server {
    listen 443 ssl http2;
    server_name cbt.sekolah.sch.id;

    ssl_certificate /etc/letsencrypt/live/cbt.sekolah.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbt.sekolah.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://cbt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
